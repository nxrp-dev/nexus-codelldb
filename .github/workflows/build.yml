name: Build adapter

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: 23.1.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-latest
            platform: win32-x64
          - image: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Matching LLDB headers
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-23.1.4
          path: llvm-source
          sparse-checkout: |
            lldb/include
            lldb/scripts
            llvm/include/llvm/BinaryFormat
      - name: Rust
        run: rustup default 1.91.0
      - name: LLVM build prerequisite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm.msi'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod "https://api.github.com/repos/llvm/llvm-project/releases/tags/llvmorg-$env:LLVM_VERSION" -Headers $headers
          $asset = $release.assets | Where-Object name -eq "LLVM-$env:LLVM_VERSION-win64.msi"
          $headers.Accept = 'application/octet-stream'
          Invoke-WebRequest $asset.url -Headers $headers -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '15e49aca3540991a6f28a0e57babab67da82155c4f73f79dd5e8666a851f9127') { throw 'LLVM checksum mismatch' }
          $install = Start-Process msiexec -ArgumentList "/i `"$installer`" /qn /norestart /L*v `"$env:RUNNER_TEMP\llvm-install.log`"" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -notin @(0, 3010)) { throw "LLVM installation failed: $($install.ExitCode)" }
          'LLVM_ROOT=C:/Program Files/LLVM' >> $env:GITHUB_ENV
          'C:/Program Files/LLVM/bin' >> $env:GITHUB_PATH
      - name: MSVC build environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%i"
          echo INCLUDE=%INCLUDE%>>%GITHUB_ENV%
          echo LIB=%LIB%>>%GITHUB_ENV%
          echo PATH=%PATH%>>%GITHUB_ENV%
          echo VSINSTALLDIR=%VSINSTALLDIR%>>%GITHUB_ENV%
      - name: LLVM build prerequisite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /etc/apt/keyrings/llvm.asc
          echo 'deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23 lldb-23 liblldb-23-dev libc++-23-dev libc++abi-23-dev
          echo 'LLVM_ROOT=/usr/lib/llvm-23' >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-23/bin' >> "$GITHUB_PATH"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl "-DLLVM_ROOT=$env:LLVM_ROOT" "-DLLVM_SOURCE_DIR=$env:GITHUB_WORKSPACE/llvm-source" -DPLATFORM_ID=${{ matrix.platform }}
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ "-DLLVM_ROOT=$LLVM_ROOT" "-DLLVM_SOURCE_DIR=$GITHUB_WORKSPACE/llvm-source" -DPLATFORM_ID=${{ matrix.platform }}
      - name: Build and test adapter
        run: cmake --build build --target check
      - name: Package adapter only
        run: cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-codelldb-${{ matrix.platform }}
          path: build/nexus-codelldb-${{ matrix.platform }}.zip
          if-no-files-found: error
